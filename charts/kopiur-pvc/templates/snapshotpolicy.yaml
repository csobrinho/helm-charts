{{- if .Values.backup.enabled }}
{{- $name := include "kopiur-pvc.name" . -}}
{{- $ns := include "kopiur-pvc.namespace" . -}}
{{- $repo := dict "kind" .Values.backup.repository.kind "name" .Values.backup.repository.name -}}
{{- if .Values.backup.repository.namespace -}}
{{- $_ := set $repo "namespace" .Values.backup.repository.namespace -}}
{{- end -}}
{{- $source := dict "pvc" (dict "name" $name) "readOnly" .Values.backup.readOnly -}}
{{- if .Values.backup.acknowledgeLiveMutation -}}
{{- $_ := set $source "acknowledgeLiveMutation" true -}}
{{- end -}}
{{- $spec := dict "repository" $repo "sources" (list $source) "copyMethod" .Values.backup.copyMethod -}}
{{- if .Values.backup.volumeSnapshotClassName -}}
{{- $_ := set $spec "volumeSnapshotClassName" .Values.backup.volumeSnapshotClassName -}}
{{- end -}}
{{- if .Values.backup.compression -}}
{{- $_ := set $spec "compression" .Values.backup.compression -}}
{{- end -}}
{{- if .Values.backup.retention -}}
{{- $_ := set $spec "retention" .Values.backup.retention -}}
{{- end -}}
{{- $mover := dict -}}
{{- if .Values.backup.inheritSecurityContextFrom -}}
{{- $_ := set $mover "inheritSecurityContextFrom" .Values.backup.inheritSecurityContextFrom -}}
{{- end -}}
{{- $mover = mergeOverwrite $mover (.Values.backup.mover | default dict) -}}
{{- if $mover -}}
{{- $_ := set $spec "mover" $mover -}}
{{- end -}}
{{- if .Values.backup.errorHandling -}}
{{- $_ := set $spec "errorHandling" .Values.backup.errorHandling -}}
{{- end -}}
{{- if .Values.backup.verification -}}
{{- $_ := set $spec "verification" .Values.backup.verification -}}
{{- end -}}
{{- if .Values.backup.credentialProjection.enabled -}}
{{- $_ := set $spec "credentialProjection" .Values.backup.credentialProjection -}}
{{- end -}}
{{- if .Values.backup.suspend -}}
{{- $_ := set $spec "suspend" true -}}
{{- end -}}
{{- $spec = mergeOverwrite $spec (.Values.backup.extraSpec | default dict) -}}
{{- $annotations := mergeOverwrite (dict) (.Values.commonAnnotations | default dict) -}}
{{- if .Values.argocd.enabled -}}
{{- $_ := set $annotations "argocd.argoproj.io/sync-wave" (.Values.argocd.syncWaves.backup | toString) -}}
{{- end -}}
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kopiur-pvc.labels" . | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
