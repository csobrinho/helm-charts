{{- $ns := include "kopiur-pvc.namespace" . -}}
{{- range $pvcName, $entry := .Values.persistence }}
{{- $entry = mergeOverwrite (fromYaml (include "kopiur-pvc.entryDefaults" $)) $entry -}}
{{- $backupCfg := mergeOverwrite (deepCopy $.Values.backup) ($entry.backup | default dict) -}}
{{- if and $entry.enabled $backupCfg.enabled }}
{{- $repo := dict "kind" $backupCfg.repository.kind "name" $backupCfg.repository.name -}}
{{- if $backupCfg.repository.namespace -}}
{{- $_ := set $repo "namespace" $backupCfg.repository.namespace -}}
{{- end -}}
{{- /*
The CRD schema itself defaults spec.sources[].sourcePathStrategy to
"PvcName" (OpenAPI structural-schema default, applied server-side and
persisted on every live object) -- set it explicitly so the rendered
manifest matches what's actually live, or ArgoCD sees permanent drift
between git (field absent) and the cluster (field always present).
*/ -}}
{{- $source := dict "pvc" (dict "name" $pvcName) "readOnly" $backupCfg.readOnly "sourcePathStrategy" "PvcName" -}}
{{- if $backupCfg.acknowledgeLiveMutation -}}
{{- $_ := set $source "acknowledgeLiveMutation" true -}}
{{- end -}}
{{- $spec := dict "repository" $repo "sources" (list $source) "copyMethod" $backupCfg.copyMethod -}}
{{- if $backupCfg.volumeSnapshotClassName -}}
{{- $_ := set $spec "volumeSnapshotClassName" $backupCfg.volumeSnapshotClassName -}}
{{- end -}}
{{- if $backupCfg.compression -}}
{{- $_ := set $spec "compression" $backupCfg.compression -}}
{{- end -}}
{{- if $backupCfg.retention -}}
{{- $_ := set $spec "retention" $backupCfg.retention -}}
{{- end -}}
{{- $mover := dict -}}
{{- if $backupCfg.inheritSecurityContextFrom -}}
{{- $_ := set $mover "inheritSecurityContextFrom" $backupCfg.inheritSecurityContextFrom -}}
{{- end -}}
{{- $mover = mergeOverwrite $mover ($backupCfg.mover | default dict) -}}
{{- if $mover -}}
{{- $_ := set $spec "mover" $mover -}}
{{- end -}}
{{- if $backupCfg.errorHandling -}}
{{- $_ := set $spec "errorHandling" $backupCfg.errorHandling -}}
{{- end -}}
{{- if $backupCfg.verification.enabled -}}
{{- $_ := set $spec "verification" (omit $backupCfg.verification "enabled") -}}
{{- end -}}
{{- if $backupCfg.credentialProjection.enabled -}}
{{- $_ := set $spec "credentialProjection" $backupCfg.credentialProjection -}}
{{- end -}}
{{- if $backupCfg.suspend -}}
{{- $_ := set $spec "suspend" true -}}
{{- end -}}
{{- $spec = mergeOverwrite $spec ($backupCfg.extraSpec | default dict) -}}
{{- $labels := mergeOverwrite (dict "app.kubernetes.io/name" $pvcName) (fromYaml (include "kopiur-pvc.labels" $)) -}}
{{- $annotations := dict -}}
{{- if $.Values.argocd.enabled -}}
{{- $_ := set $annotations "argocd.argoproj.io/sync-wave" ($.Values.argocd.syncWaves.backup | toString) -}}
{{- end -}}
{{- $annotations = mergeOverwrite $annotations ($.Values.commonAnnotations | default dict) -}}
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: {{ $pvcName }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{ end }}
{{- end }}
