{{- $ns := include "kopiur-pvc.namespace" . -}}
{{- $items := fromYaml (include "kopiur-pvc.items" .) -}}
{{- range $pvcName, $override := $items }}
{{- $override = $override | default dict -}}
{{- $pvcCfg := mergeOverwrite (deepCopy $.Values.pvc) ($override.pvc | default dict) -}}
{{- $populateCfg := mergeOverwrite (deepCopy $.Values.populate) ($override.populate | default dict) -}}
{{- $spec := dict "accessModes" $pvcCfg.accessModes "resources" (dict "requests" (dict "storage" $pvcCfg.size)) -}}
{{- if $pvcCfg.storageClassName -}}
{{- $_ := set $spec "storageClassName" $pvcCfg.storageClassName -}}
{{- end -}}
{{- if $pvcCfg.volumeMode -}}
{{- $_ := set $spec "volumeMode" $pvcCfg.volumeMode -}}
{{- end -}}
{{- if $populateCfg.enabled -}}
{{- $_ := set $spec "dataSourceRef" (dict "apiGroup" "kopiur.home-operations.com" "kind" "Restore" "name" $pvcName) -}}
{{- end -}}
{{- $spec = mergeOverwrite $spec ($pvcCfg.extraSpec | default dict) -}}
{{- $labels := mergeOverwrite (dict "app.kubernetes.io/name" $pvcName) (fromYaml (include "kopiur-pvc.labels" $)) -}}
{{- $labels = mergeOverwrite $labels ($pvcCfg.labels | default dict) -}}
{{- $argoAnnotations := dict -}}
{{- if $.Values.argocd.enabled -}}
{{- $_ := set $argoAnnotations "argocd.argoproj.io/sync-wave" ($.Values.argocd.syncWaves.pvc | toString) -}}
{{- if $.Values.argocd.protectPvcFromDeletion -}}
{{- $_ := set $argoAnnotations "argocd.argoproj.io/sync-options" "Prune=false,Delete=false" -}}
{{- end -}}
{{- end -}}
{{- $annotations := mergeOverwrite $argoAnnotations ($.Values.commonAnnotations | default dict) ($pvcCfg.annotations | default dict) -}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvcName }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
