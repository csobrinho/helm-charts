{{- $ns := include "kopiur-pvc.namespace" . -}}
{{- range $pvcName, $entry := .Values.persistence }}
{{- $entry = mergeOverwrite (fromYaml (include "kopiur-pvc.entryDefaults" $)) $entry -}}
{{- if and $entry.enabled (not $entry.existingClaim) }}
{{- $spec := dict "accessModes" (list $entry.accessMode) "resources" (dict "requests" (dict "storage" $entry.size)) -}}
{{- if $entry.storageClass -}}
{{- $_ := set $spec "storageClassName" $entry.storageClass -}}
{{- end -}}
{{- if $entry.volumeMode -}}
{{- $_ := set $spec "volumeMode" $entry.volumeMode -}}
{{- end -}}
{{- $populateCfg := mergeOverwrite (deepCopy $.Values.populate) ($entry.populate | default dict) -}}
{{- if $populateCfg.enabled -}}
{{- $_ := set $spec "dataSourceRef" (dict "apiGroup" "kopiur.home-operations.com" "kind" "Restore" "name" $pvcName) -}}
{{- end -}}
{{- $spec = mergeOverwrite $spec ($entry.extraSpec | default dict) -}}
{{- $labels := mergeOverwrite (dict "app.kubernetes.io/name" $pvcName) (fromYaml (include "kopiur-pvc.labels" $)) -}}
{{- $labels = mergeOverwrite $labels ($entry.labels | default dict) -}}
{{- $argoAnnotations := dict -}}
{{- if $.Values.argocd.enabled -}}
{{- $_ := set $argoAnnotations "argocd.argoproj.io/sync-wave" ($.Values.argocd.syncWaves.pvc | toString) -}}
{{- if $.Values.argocd.protectPvcFromDeletion -}}
{{- $_ := set $argoAnnotations "argocd.argoproj.io/sync-options" "Prune=false,Delete=false" -}}
{{- end -}}
{{- end -}}
{{- if $entry.retain -}}
{{- $_ := set $argoAnnotations "helm.sh/resource-policy" "keep" -}}
{{- end -}}
{{- $annotations := mergeOverwrite $argoAnnotations ($.Values.commonAnnotations | default dict) ($entry.annotations | default dict) -}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvcName }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{ end }}
{{- end }}
