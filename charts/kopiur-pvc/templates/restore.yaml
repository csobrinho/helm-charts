{{- $ns := include "kopiur-pvc.namespace" . -}}
{{- range $pvcName, $entry := .Values.persistence }}
{{- $entry = mergeOverwrite (fromYaml (include "kopiur-pvc.entryDefaults" $)) $entry -}}
{{- $populateCfg := mergeOverwrite (deepCopy $.Values.populate) ($entry.populate | default dict) -}}
{{- if and $entry.enabled $populateCfg.enabled }}
{{- $policyRef := dict "name" ($populateCfg.sourcePolicy.name | default $pvcName) -}}
{{- if $populateCfg.sourcePolicy.namespace -}}
{{- $_ := set $policyRef "namespace" $populateCfg.sourcePolicy.namespace -}}
{{- end -}}
{{- if $populateCfg.offset -}}
{{- $_ := set $policyRef "offset" $populateCfg.offset -}}
{{- end -}}
{{- if $populateCfg.asOf -}}
{{- $_ := set $policyRef "asOf" $populateCfg.asOf -}}
{{- end -}}
{{- $policy := dict "onMissingSnapshot" $populateCfg.onMissingSnapshot -}}
{{- if $populateCfg.waitTimeout -}}
{{- $_ := set $policy "waitTimeout" $populateCfg.waitTimeout -}}
{{- end -}}
{{- /*
target is ALWAYS populator, even for existingClaim. target.pvcRef is an
ACTIVE, one-shot restore -- it writes into the PVC the moment it resolves a
snapshot, bound or not, so it would overwrite an already-populated volume
the first time existingClaim points at one. populator is passive (only acts
when a PVC's own dataSourceRef claims it) and safely no-ops on a PVC that's
already Bound -- exactly what a chart-external PVC needs.
*/ -}}
{{- $spec := dict "source" (dict "fromPolicy" $policyRef) "target" (dict "populator" dict) "policy" $policy -}}
{{- if $populateCfg.credentialProjection -}}
{{- $_ := set $spec "credentialProjection" (dict "enabled" true) -}}
{{- end -}}
{{- $mover := mergeOverwrite (fromYaml (include "kopiur-pvc.uidMover" (dict "uid" ($entry.uid | default $.Values.uid) "gid" ($entry.gid | default $.Values.gid)))) ($populateCfg.mover | default dict) -}}
{{- if $mover -}}
{{- $_ := set $spec "mover" $mover -}}
{{- end -}}
{{- $spec = mergeOverwrite $spec ($populateCfg.extraSpec | default dict) -}}
{{- $labels := mergeOverwrite (dict "app.kubernetes.io/name" $pvcName) (fromYaml (include "kopiur-pvc.labels" $)) -}}
{{- $annotations := dict -}}
{{- if $.Values.argocd.enabled -}}
{{- $_ := set $annotations "argocd.argoproj.io/sync-wave" ($.Values.argocd.syncWaves.restore | toString) -}}
{{- end -}}
{{- $annotations = mergeOverwrite $annotations ($.Values.commonAnnotations | default dict) -}}
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: {{ $pvcName }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{ end }}
{{- end }}
