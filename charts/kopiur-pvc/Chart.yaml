apiVersion: v2
name: kopiur-pvc
description: >-
  Creates a PersistentVolumeClaim wired to kopiur (a Kopia-native Kubernetes
  backup operator): a SnapshotPolicy + SnapshotSchedule for scheduled
  backups, and a Restore in passive-populator mode so a new/empty PVC is
  deploy-or-restored from the latest snapshot automatically.
type: application
version: 0.1.4
# kopiur is v1alpha1 and its CRD surface moves between releases; this chart's
# field names/shapes were verified against the kopiur v0.10.7 CRDs.
appVersion: "0.10.7"
home: https://github.com/csobrinho/helm-charts
sources:
  - https://github.com/csobrinho/helm-charts
  - https://github.com/home-operations/kopiur
keywords:
  - kopiur
  - kopia
  - backup
  - pvc
  - snapshot
maintainers:
  - name: csobrinho
    url: https://github.com/csobrinho
annotations:
  org.opencontainers.image.source: https://github.com/csobrinho/helm-charts
