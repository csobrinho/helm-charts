---
# yaml-language-server: $schema=values.schema.json

# -- Name of the single PVC when `pvcs` (below) is left empty (defaults to the
# release name). Ignored once `pvcs` is set — each of its keys is used as that
# entry's own PVC name instead.
nameOverride: ""
# -- Override the namespace all resources are created in (defaults to the release namespace). Shared across every entry in `pvcs`.
namespaceOverride: ""

# -- Labels applied to every resource this chart renders, on top of the standard app.kubernetes.io/* labels. Shared across every entry in `pvcs`.
commonLabels: {}
# -- Annotations applied to every resource this chart renders. Shared across every entry in `pvcs`.
commonAnnotations: {}

# -- Define multiple PVCs (each with its own populate/backup config) in one
# Helm release, keyed by PVC name. Useful when an app owns several volumes
# that need different backup treatment — e.g. Plex's `media` (huge,
# `populate.enabled: false`, no hook) and `config` (small, a live SQLite DB
# that needs a `beforeSnapshot` hook via `backup.extraSpec`) — but should
# still ship as one release. Each entry is a *sparse* override with the same
# shape as the top-level `pvc`/`populate`/`backup` blocks below, deep-merged
# onto them as shared defaults (set `backup.repository.name` once at the top
# level rather than in every entry). Leave empty to render a single PVC named
# `nameOverride` (or the release name) straight from the top-level blocks.
#
# pvcs:
#   media:
#     pvc:
#       size: 2Ti
#     populate:
#       enabled: false
#   config:
#     pvc:
#       size: 5Gi
#     backup:
#       extraSpec:
#         hooks:
#           beforeSnapshot:
#             - command: ["curl", "-fsS", "-X", "POST", "http://plex:32400/..."]
pvcs: {}

pvc:
  # -- Access modes for the PVC.
  accessModes:
    - ReadWriteOnce
  # -- Requested size of the PVC (e.g. "10Gi").
  size: 10Gi
  # -- StorageClass for the PVC; empty uses the cluster default StorageClass.
  storageClassName: ""
  # -- volumeMode for the PVC: Filesystem or Block.
  volumeMode: Filesystem
  # -- Extra labels for the PVC only.
  labels: {}
  # -- Extra annotations for the PVC only.
  annotations: {}
  # -- Escape hatch: extra fields deep-merged into the PersistentVolumeClaim.spec.
  extraSpec: {}

populate:
  # -- Wire the PVC's spec.dataSourceRef to a kopiur Restore in passive-populator
  # mode, so a brand-new/empty PVC is deploy-or-restored from the backup
  # SnapshotPolicy's latest snapshot before it is ever bound. Requires the
  # kopiur controller to be installed with installScope=cluster (the default) —
  # the populator path is refused under installScope=namespaced.
  enabled: true
  # -- What to do when no snapshot exists yet (first-ever deploy, empty
  # repository). `Continue` provisions an empty volume so the app can start
  # and take its first backup; `Fail` refuses to bind the PVC instead.
  onMissingSnapshot: Continue
  # -- How long to wait for the source snapshot to appear before giving up (e.g. "5m"). Empty uses the controller default.
  waitTimeout: ""
  # -- Which snapshot to restore: 0 = latest, 1 = previous, and so on.
  offset: 0
  # -- Restore the newest snapshot at or before this RFC3339 timestamp (point-in-time restore). Empty = latest.
  asOf: ""
  # -- Copy the repository's credential Secret(s) into this namespace for the
  # restore Job. Defaults on: a shared ClusterRepository's Secret normally
  # lives in one namespace (e.g. the kopiur controller's), and this is what
  # lets a mover in any other namespace read it. Requires the kopiur
  # controller's features.credentialProjection.enabled=true (a cluster-wide
  # controller setting — assumed already on; this value has no effect otherwise).
  credentialProjection: true
  mover:
    # -- Restore-mover UID/GID identity. Defaults to `inheritSecurityContextFrom.snapshot`
    # (the identity kopia RECORDED on the backup itself, `Snapshot.status.recorded`) —
    # the only mode that needs no live workload pod, so it works on a freshly
    # rebuilt cluster and is exactly what `target.populator` runs before. Override
    # or set to `{}` to fall back to `mover.securityContext`/`podSecurityContext`
    # (merge those in via `populate.extraSpec` if needed).
    inheritSecurityContextFrom:
      snapshot: {}
  sourcePolicy:
    # -- Name of the SnapshotPolicy to restore from. Empty defaults to the
    # SnapshotPolicy this chart creates (the normal self-restore case). Set
    # this to restore from a *different* policy/namespace, e.g. when
    # migrating a PVC's data to a new name or cluster.
    name: ""
    # -- Namespace of the source SnapshotPolicy. Empty defaults to this release's namespace.
    namespace: ""
  # -- Escape hatch: extra fields deep-merged into Restore.spec.
  extraSpec: {}

backup:
  # -- Create a SnapshotPolicy (and, when schedule.cron is set, a
  # SnapshotSchedule) that backs up this PVC to a kopiur repository.
  enabled: true
  repository:
    # -- Which repository CRD this points at: "Repository" or "ClusterRepository".
    kind: ClusterRepository
    # -- Name of the referenced Repository/ClusterRepository.
    name: s3
    # -- Cross-namespace Repository reference; ignored/forbidden for ClusterRepository.
    namespace: ""
  # -- How the source volume is captured before kopia reads it: "Snapshot"
  # (CRD default), "Direct", or "Clone". IMPORTANT for CSI drivers whose
  # VolumeSnapshot support full-copies the volume rather than taking a real
  # delta snapshot (e.g. proxmox-csi): under "Snapshot"/"Clone" every scheduled
  # backup first full-copies the PVC before kopia reads a byte — not viable at
  # any real size. Set "Direct" for those drivers; leave "Snapshot" only where
  # VolumeSnapshot is a genuine CoW/delta snapshot (e.g. Ceph RBD/CephFS).
  copyMethod: Direct
  # -- VolumeSnapshotClass used when copyMethod is "Snapshot"/"Clone". Ignored under "Direct". Empty omits the field.
  volumeSnapshotClassName: ""
  # -- Mount the source read-only (kopia only ever reads it). Leave `true`.
  # Setting `false` is ONLY meaningful to make a mover `fsGroup` take effect
  # (the kubelet skips its recursive fsGroup chgrp on a read-only mount) — and
  # under `copyMethod: Direct` that chgrp walk rewrites the LIVE volume
  # permanently, while the workload is running. Resolve read access via
  # `mover.inheritSecurityContextFrom` instead of flipping this.
  readOnly: true
  # -- Required acknowledgement to set `readOnly: false` together with
  # `copyMethod: Direct` (rejected by the webhook otherwise). Leave `false`
  # unless you have deliberately accepted the live-volume chgrp above.
  acknowledgeLiveMutation: false
  # -- Backup-mover UID/GID identity (oneOf `workloadSelector`/`pvcConsumer`/`snapshot`).
  # Only needed when the source isn't already readable at the mover's default
  # identity. Prefer `workloadSelector` (resolves against the Deployment's pod
  # template) over `pvcConsumer` (resolves the pod currently mounting the PVC —
  # returns nothing if the workload is scaled to zero or mid-rollout when the
  # schedule fires). Requires the workload to pin `runAsUser` explicitly (a UID
  # from the image's `USER` line is invisible to Kubernetes and can't be
  # inherited). Empty = mover's own default identity.
  inheritSecurityContextFrom: {}
  # -- Kopia compression settings, e.g. {compressor: zstd}. Set to {} to omit.
  compression:
    compressor: zstd
  # -- GFS retention policy for snapshots this policy produces.
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
    keepAnnual: 0
  # -- Per-run mover overrides (resources, cache, securityContext) for backup
  # Jobs — merged with `inheritSecurityContextFrom` above into the same
  # `mover` object. Set to {} to add nothing beyond that.
  mover: {}
  # -- Backup-side error handling: let a snapshot complete-with-errors instead
  # of failing outright (e.g. `{ignoreFileErrors: true}`). Leave {} (fail
  # loudly) unless you've deliberately chosen to swallow a specific class of
  # error — `ignoreFileErrors` turns a loud failure into a snapshot quietly
  # missing files, only discovered at restore time.
  errorHandling: {}
  # -- Post-backup verification (e.g. `{quick: {schedule: {cron: "H 3 * * 0"}},
  # successExpr: "stats.errors == 0 && stats.files > 0"}` — successExpr is a
  # CEL predicate applying to both the quick and deep tiers, not nested under
  # either). Catches a snapshot that "succeeds" with zero files. {} disables it.
  verification: {}
  credentialProjection:
    # -- Copy the repository's credential Secret(s) into this namespace for
    # each backup mover Job. Defaults on for the same shared-repository reason
    # as `populate.credentialProjection` above.
    enabled: true
  # -- Skip future scheduled runs while true (the policy still exists; a manual Snapshot can still be created).
  suspend: false
  schedule:
    # -- Cron expression (Jenkins-style "H" substitution supported, e.g. "H 2 * * *"). Empty = no SnapshotSchedule is rendered (the SnapshotPolicy still exists and can be triggered manually or by an external SnapshotSchedule).
    cron: "H 2 * * *"
    # -- Deterministic jitter applied to the cron firing (Go-style duration).
    jitter: 30m
    # -- Fire immediately when the SnapshotSchedule is created, in addition to the cron cadence.
    runOnCreate: false
    # -- IANA timezone the cron is evaluated in; empty uses the controller's default.
    timezone: ""
    # -- Skip future firings while true.
    suspend: false
    # -- How to handle a firing while a prior run is still in flight: Forbid, Allow, or Replace.
    concurrencyPolicy: Forbid
    # -- If a slot is missed by more than this many seconds, skip it instead of firing late.
    startingDeadlineSeconds: null
    # -- Escape hatch: extra fields deep-merged into SnapshotSchedule.spec.
    extraSpec: {}
  # -- Escape hatch: extra fields deep-merged into SnapshotPolicy.spec (wins over the generated values above). Use for hooks, files, staging, groupBy, identity, etc.
  extraSpec: {}

argocd:
  # -- Stamp ArgoCD annotations on the rendered resources (sync-wave ordering +
  # PVC deletion protection). Plain annotations, inert outside ArgoCD, so safe
  # to leave on even if this isn't (yet) synced by ArgoCD.
  enabled: true
  # -- Sync-wave numbers controlling apply order in an ArgoCD-orchestrated sync:
  # the SnapshotPolicy/SnapshotSchedule first (a Restore resolves the policy's
  # identity to find its latest snapshot), then the Restore (so its populator
  # claim exists), then the PVC last (so dataSourceRef has something to claim
  # before the CSI populator races the provisioner). Only matters when these
  # resources sync together in one wave-aware Application; Kustomize's
  # `helmCharts:` inflator ignores these annotations entirely. Shared across
  # every entry in `pvcs`.
  syncWaves:
    backup: "-2"
    restore: "-1"
    pvc: "0"
  # -- Add `argocd.argoproj.io/sync-options: Prune=false,Delete=false` to every
  # PVC so ArgoCD never deletes live volumes — not on a prune (removed from
  # git / backup.enabled or populate.enabled toggled off) and not on a
  # cascading Application delete. The single most important GitOps guard for
  # a resource holding data that may not be backed up yet; disable only if you
  # want ArgoCD to fully own the PVC's lifecycle.
  protectPvcFromDeletion: true
