---
# Source: kopiur-pvc/templates/restore.yaml
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: esphome-config-manual
  namespace: existingclaim
  labels:
    app.kubernetes.io/instance: existingclaim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: esphome-config-manual
    app.kubernetes.io/version: 0.10.7
    helm.sh/chart: kopiur-pvc-0.1.5
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  credentialProjection:
    enabled: true
  mover:
    inheritSecurityContextFrom:
      snapshot: {}
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: esphome-config-manual
  target:
    pvcRef:
      name: esphome-config-manual


---
# Source: kopiur-pvc/templates/snapshotpolicy.yaml
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: esphome-config-manual
  namespace: existingclaim
  labels:
    app.kubernetes.io/instance: existingclaim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: esphome-config-manual
    app.kubernetes.io/version: 0.10.7
    helm.sh/chart: kopiur-pvc-0.1.5
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  compression:
    compressor: zstd
  copyMethod: Direct
  credentialProjection:
    enabled: true
  repository:
    kind: ClusterRepository
    name: primary
  retention:
    keepAnnual: 0
    keepDaily: 7
    keepHourly: 24
    keepLatest: 3
    keepMonthly: 6
    keepWeekly: 4
  sources:
  - pvc:
      name: esphome-config-manual
    readOnly: true
  verification:
    quick:
      schedule:
        cron: H 3 * * 0
        jitter: 30m
    successExpr: stats.errors == 0 && stats.files > 0


---
# Source: kopiur-pvc/templates/snapshotschedule.yaml
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: esphome-config-manual
  namespace: existingclaim
  labels:
    app.kubernetes.io/instance: existingclaim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: esphome-config-manual
    app.kubernetes.io/version: 0.10.7
    helm.sh/chart: kopiur-pvc-0.1.5
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  policyRef:
    name: esphome-config-manual
  schedule:
    concurrencyPolicy: Forbid
    cron: H 2 * * *
    jitter: 30m
