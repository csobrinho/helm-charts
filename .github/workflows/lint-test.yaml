name: Lint & Test Charts

on:
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"
  push:
    branches:
      - main
    paths:
      - "charts/**"

permissions: {}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "4.2.4"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      # On a PR, ct's own target-branch diff (PR head vs base) is meaningful,
      # so use it directly -- this is also what enforces "you edited the
      # chart but forgot to bump version". On push (to main, post-merge)
      # there is nothing meaningful to diff against: origin/main already
      # points at this same commit, so `ct lint --target-branch main` would
      # always see zero changes here. `--all` sidesteps that by skipping diff
      # detection entirely, at the cost of the version-increment check, which
      # doesn't matter post-merge anyway.
      - name: Run chart-testing (lint)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ct lint --target-branch "${{ github.event.pull_request.base.ref }}" --validate-maintainers=false
          else
            ct lint --all --validate-maintainers=false
          fi

      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      # Each chart's own golden-file render tests (charts/<name>/tests/render_test.sh,
      # if present) plus a plain kubeconform pass. Always runs for every
      # chart -- with one or two charts in this repo, that's cheap, and it
      # sidesteps the same push-vs-PR diff-detection problem noted above.
      - name: Render tests + kubeconform
        run: |
          set -euo pipefail
          for chart_dir in charts/*/; do
            name="$(basename "$chart_dir")"
            echo "::group::${name}"

            if [ -x "${chart_dir}tests/render_test.sh" ]; then
              "${chart_dir}tests/render_test.sh"
            fi

            rendered="/tmp/${name}-rendered.yaml"
            helm template "$name" "$chart_dir" --namespace default > "$rendered"
            # kopiur's kopiur.home-operations.com CRDs (and any other CRD) have no
            # public JSON-schema catalog entry, so their schema lookup is skipped
            # rather than failed; core Kubernetes kinds (PVC, etc.) are still
            # fully validated.
            kubeconform -ignore-missing-schemas -summary -output pretty "$rendered"
            echo "::endgroup::"
          done

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0

      # `ct install` needs kopiur's CRDs + controller in the cluster (so the
      # admission webhook can actually accept/reject a SnapshotPolicy/Restore)
      # and a real repository for backup.repository.name in
      # charts/kopiur-pvc/ci/default-values.yaml to resolve against -- an
      # in-cluster MinIO stands in for that. `populate.enabled: false` in that
      # ci/ values file means the dataSourceRef/populator round-trip itself is
      # NOT exercised here (it needs a longer-running real cluster to wait on
      # reliably); verify that manually against the target cluster before
      # relying on it, per each chart's README.
      - name: Install kopiur controller + CRDs
        run: |
          helm install kopiur oci://ghcr.io/home-operations/charts/kopiur \
            --namespace kopiur-system --create-namespace \
            --wait --timeout 5m

      - name: Bootstrap test repository (MinIO + ClusterRepository)
        run: |
          kubectl apply -f .github/ci-fixtures/kopiur-test-repo.yaml
          kubectl -n minio wait --for=condition=Available --timeout=120s deployment/minio
          kubectl -n minio wait --for=condition=Complete --timeout=120s job/minio-make-bucket
          kubectl wait --for=jsonpath='{.status.phase}'=Ready --timeout=120s clusterrepository/ci-test

      - name: Run chart-testing (install)
        run: ct install --all
