name: Release Charts (OCI)

on:
  push:
    branches:
      - main
    paths:
      - "charts/**/Chart.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # For cosign keyless signing (Sigstore Fulcio/Rekor via GitHub's OIDC token).
  id-token: write

env:
  OCI_REPO: ghcr.io/${{ github.repository_owner }}/helm-charts

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "4.2.4"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # On a push event, only the charts whose Chart.yaml actually changed in
      # THIS push (github.event.before -> github.event.after — NOT `ct
      # list-changed --target-branch main`, which diffs against origin/main
      # and would compare main against itself here, always empty) are
      # candidates. workflow_dispatch has no before/after to diff, so it
      # falls back to every chart. Either way, "already published" (below)
      # is the real safety net: a chart is only ever packaged/pushed/signed
      # once for a given version, however it was selected.
      - name: Package, push & sign changed charts
        run: |
          set -euo pipefail
          mkdir -p /tmp/dist

          before='${{ github.event.before }}'
          if [[ "${{ github.event_name }}" == "push" && "$before" != "0000000000000000000000000000000000000000" ]]; then
            chart_dirs="$(git diff --name-only "$before" '${{ github.event.after }}' \
              -- 'charts/*/Chart.yaml' | xargs -r -n1 dirname | sort -u)"
          else
            chart_dirs="$(dirname charts/*/Chart.yaml)"
          fi

          if [[ -z "$chart_dirs" ]]; then
            echo "No changed Chart.yaml files, nothing to publish."
            exit 0
          fi

          for chart_dir in $chart_dirs; do
            chart_yaml="$chart_dir/Chart.yaml"
            name="$(yq -r '.name' "$chart_yaml")"
            version="$(yq -r '.version' "$chart_yaml")"
            ref="oci://${OCI_REPO}/${name}"

            if helm show chart "$ref" --version "$version" >/dev/null 2>&1; then
              echo "${name}-${version} already published at ${ref}, skipping"
              continue
            fi

            echo "Publishing ${name}-${version} to ${ref}"
            helm package "$chart_dir" -d /tmp/dist
            push_output="$(helm push "/tmp/dist/${name}-${version}.tgz" "oci://${OCI_REPO}" 2>&1 | tee /dev/stderr)"
            digest="$(echo "$push_output" | grep -oP 'Digest: \Ksha256:[0-9a-f]+')"

            echo "Signing ${OCI_REPO}/${name}@${digest}"
            cosign sign --yes "${OCI_REPO}/${name}@${digest}"
          done
